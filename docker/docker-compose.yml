name: ecos-landing

services:
  ecos:
    image: nginx:alpine
    container_name: ecos-web
    hostname: ecos
    restart: always
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8086:8080"
    networks:
      ecos-network:
        aliases:
          - ecos

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: ecos-tunnel
    restart: always
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "run"
      - "--token"
      - "${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiMDI5NDc1MzY0YWNjNDEzY2Q2Y2YzNWVkOGU0MjEzNGIiLCJ0IjoiNTYyN2Q4NTgtNThhZC00OTE3LWFhMzktNjZkOGNmZWZlMzk2IiwicyI6Ill6WmtOMkppWVdVdE1UVTVNQzAwTkRGbUxUaGhNVGd0WkdZNE56QXlZMlEyTmpOaCJ9}"
    networks:
      - ecos-network
    depends_on:
      - ecos

networks:
  ecos-network:
    driver: bridge
