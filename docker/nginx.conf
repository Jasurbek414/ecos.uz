server {
    listen 8080;
    server_name ecos.uz www.ecos.uz localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Force HTTPS redirect if request came via plain HTTP through Cloudflare
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Strict Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Never cache errors (404, 500, etc.)
    error_page 404 = @notfound;
    location @notfound {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        return 404;
    }

    # Static assets caching - only for existing files
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri @notfound;
    }

    # Images caching
    location /images/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri @notfound;
    }

    # SPA routing - index.html must never be cached
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
